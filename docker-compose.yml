name: erp-assistant

x-php: &php
  build:
    context: ./docker/php
  working_dir: /var/www/backend
  volumes:
    - ./backend:/var/www/backend
    - ./corpus:/var/www/corpus:ro
  environment:
    APP_ENV: dev
    DATABASE_URL: "mysql://${DB_USER}:${DB_PASSWORD}@mariadb:3306/${DB_NAME}?serverVersion=11.8.2-MariaDB&charset=utf8mb4"
    MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
    OLLAMA_URL: ${OLLAMA_URL}
    OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    mariadb:
      condition: service_healthy

services:
  php:
    <<: *php

  worker:
    <<: *php
    command: php bin/console messenger:consume async --time-limit=3600 -vv
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      WATCHPACK_POLLING: "true"

  # Uniquement sous Linux / serveur. Sur Mac, lancer Ollama en natif (GPU Metal).
  ollama:
    image: ollama/ollama
    profiles: ["ollama-docker"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  db_data:
  frontend_node_modules:
  ollama_data: