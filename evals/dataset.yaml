# Jeu d'évaluation de l'assistant documentaire Gestix.
#
# Chaque cas :
#   category  fact (fait précis, une page), multi (plusieurs pages), paraphrase (formulation éloignée
#             du corpus), refusal (information absente : refus attendu)
#   question  question posée à POST /api/chat
#   sources   pages du corpus acceptées comme source (au moins une doit être retrouvée / citée)
#   facts     faits attendus dans la réponse : tous sont requis ; chaque fait est une liste de variantes
#             acceptées. Comparaison sans casse, sans accents, espaces normalisées (« 5 000 » = « 5000 »).
#
# Les réponses attendues s'appuient sur des règles précises du corpus : ne pas modifier l'un sans l'autre.

# --- Faits précis --------------------------------------------------------------------------------

